<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gemini Live Chat</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gemini Live Chat</h1>
    <p id="status">Menghubungkan...</p>
  </header>

  <nav id="tabs">
    <button id="tabAvatar" class="tab">Avatar</button>
    <button id="tabText" class="tab">Teks</button>
  </nav>

  <section id="avatarPanel">
    <canvas id="avatar" width="440" height="520" aria-label="Avatar santri"></canvas>
    <div class="avatar-meta">
      <span id="avatarState">Santai</span>
      <label class="search"><input type="checkbox" id="avatarToggle" checked /> Avatar</label>
    </div>
  </section>

  <main id="log" aria-live="polite"></main>

  <footer>
    <div class="row">
      <button id="micBtn">Mulai Mic</button>
      <button id="stopBtn" disabled>Hentikan Audio</button>
      <label class="search"><input type="checkbox" id="searchBox" /> Search</label>
      <label class="search">Suara:
        <select id="voiceBox">
          <option value="Charon">Charon (pria)</option>
          <option value="Puck">Puck (pria)</option>
          <option value="Fenrir">Fenrir (pria)</option>
          <option value="Orus">Orus (pria)</option>
          <option value="Algenib">Algenib (pria)</option>
          <option value="Rasalgethi">Rasalgethi (pria)</option>
          <option value="Gacrux">Gacrux (pria)</option>
          <option value="Sadaltager">Sadaltager (pria)</option>
        </select>
      </label>
    </div>
    <form id="form">
      <input id="input" type="text" placeholder="Ketik pesan + Enter..." autocomplete="off" />
      <button type="submit">Kirim</button>
    </form>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
